AWSTemplateFormatVersion: 2010-09-09
Description: >-
  ses-dashboard

Transform:
- AWS::Serverless-2016-10-31

Parameters:
  BounceSNSTopic:
    Type: "String"
    Description: "The bounce Amazon SNS Topic that has been created for the SES identity. 
    Specify the SNS Topic by using its Amazon Resource Name (ARN). 
    Examples: arn:aws:sns:us-east-1:123456789012:ses-bounce-notification."

Globals:
  Function:
    Runtime: nodejs18.x
    MemorySize: 128
    Timeout: 30
    Tracing: Active
  Api:
    EndpointConfiguration: EDGE 
    TracingEnabled: true     
    Cors:
      AllowMethods: "'OPTIONS,GET'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'" 

Resources:
############################################################################################################################################################################
#   Dead Letter Queue for failed SQS messages
############################################################################################################################################################################
  BounceDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      
############################################################################################################################################################################
#   SQS Queue that subscribes to the SES SNS Notification Topic
############################################################################################################################################################################
  BounceSQS:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      VisibilityTimeout: 90 # 3x Lambda timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BounceDLQ.Arn
        maxReceiveCount: 3

  BounceSQSPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: 
        - !Ref BounceSQS
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Principal:
              AWS:
                - !Ref AWS::AccountId
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
            Effect: Allow
            Resource: !GetAtt BounceSQS.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref BounceSNSTopic

  BounceSQSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      RawMessageDelivery: true
      Endpoint: !GetAtt BounceSQS.Arn
      TopicArn: !Ref BounceSNSTopic

############################################################################################################################################################################
#   DynamoDB Table that stores SES events
############################################################################################################################################################################
  SESEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: "id"
        AttributeType: "S"
      - AttributeName: "timestamp"
        AttributeType: "S"
      KeySchema:
      - AttributeName: "id"
        KeyType: "HASH"
      - AttributeName: "timestamp"
        KeyType: "RANGE"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: True
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

############################################################################################################################################################################
#   Lambda Function that processes the items on the SES SQS queues
############################################################################################################################################################################
  ProcessSESQueue:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ses_queue_handler/
      Handler: SesNotification.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref SESEventsTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref SESEventsTable
      Events:
        BounceSQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt BounceSQS.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
  
  ProcessSESQueueLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProcessSESQueue}
      RetentionInDays: 7

############################################################################################################################################################################
#   Lambda Function that retrieves the events stored in the DynamoDB table 
############################################################################################################################################################################
  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_events/
      Handler: getEvents.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref SESEventsTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName: !Ref SESEventsTable
      Events:
        HttpPost:
          Type: Api
          Properties:
            Path: '/'
            Method: get

  GetEventsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetEventsFunction}
      RetentionInDays: 7

############################################################################################################################################################################
#   CloudWatch Alarms
############################################################################################################################################################################
  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alert when messages arrive in DLQ
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt BounceDLQ.QueueName

  ProcessSESQueueErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Alert on Lambda processing errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessSESQueue

############################################################################################################################################################################
#   Outputs
############################################################################################################################################################################
 
Outputs:
  EventsAPI:
    Description: API to retrieve events
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
  
  DLQUrl:
    Description: Dead Letter Queue URL
    Value: !Ref BounceDLQ
    
  TableName:
    Description: DynamoDB Table Name
    Value: !Ref SESEventsTable

